<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" type="image/svg+xml" href="assets/home/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intranet Inelcom Chile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/sistema/01-tokens.css" />
    <link rel="stylesheet" href="css/sistema/02-base.css" />
    <link rel="stylesheet" href="css/sistema/03-layout.css" />
    <link rel="stylesheet" href="css/sistema/04-components.css" />
    <link rel="stylesheet" href="css/sistema/05-sidebar.css" />

    <link rel="stylesheet" href="css/pantallas/inicio.css" />
    <script src="js/sidebar.js" defer></script>
    <script src="js/inicio-carrusel.js" defer></script>
    <script src="js/inicio-festivos.js" defer></script>
    <script src="js/inicio-cumpleanos.js" defer></script>
  </head>
  <body data-pagina="inicio">
    <div class="l-app">
      <!-- El menú lo pinta js/sidebar.js, igual en todas las pantallas -->
      <div data-sidebar-slot></div>
      <div class="l-main">
        <main class="l-body">
          <h1 class="u-visually-hidden">Panel principal — Intranet Inelcom</h1>

          <header class="s-inicio__hero">
            <div class="s-inicio__fondo" aria-hidden="true">
              <img src="assets/home/img-edificioinelcom.png" alt="" />
            </div>
            <div class="s-inicio__heroContenido">
              <div class="s-inicio__heroTop">
                <img
                  class="s-inicio__logo"
                  src="assets/home/header-logo.svg"
                  alt="Inelcom Chile"
                />
                <div class="s-inicio__acciones">
                  <!-- Nombre y avatar hardcodeados como placeholder de diseño.
                       Deberían venir de la sesión/usuario autenticado. -->
                  <button type="button" class="s-inicio__perfil">
                    <img class="c-avatar" src="assets/home/img-boy.png" alt="" />
                    <span class="s-inicio__perfilNombre"
                      >Raúl Gabriel Berríos Jofré</span
                    >
                  </button>
                  <button
                    type="button"
                    class="c-iconbtn"
                    aria-label="Cerrar sesión"
                  >
                    <img class="c-icon" src="assets/home/ic-logout.svg" alt="" />
                  </button>
                </div>
              </div>
              <div class="s-inicio__destacados">
                <button type="button" class="s-inicio__destacado">
                  <span class="s-inicio__destacadoLabel">Mis Vacaciones</span>
                  <img
                    class="s-inicio__ilus s-inicio__ilus--lg"
                    src="assets/home/img-vacaciones.png"
                    alt=""
                  />
                </button>
                <button type="button" class="s-inicio__destacado">
                  <span class="s-inicio__destacadoLabel">Agendar Sala</span>
                  <img class="s-inicio__ilus s-inicio__ilus--lg" src="assets/home/img-sala.png" alt="" />
                </button>
              </div>
            </div>
          </header>

          <!-- Botones listos para definir sus rutas-->
          <nav class="s-inicio__accesos" aria-label="Accesos rápidos">
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-oc.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Orden de Compra</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-vacation.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Solicitud de Vacaciones</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-vacacionpersona.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Personal en Vacaciones</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-vacacioncalendario.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel"
                >Días de Vacaciones Colaboradores</span
              >
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-reclutamiento.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Reclutamiento y Selección</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-reclutamiento-activos.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Reclutamientos Activos</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-solicitudes.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Base de Datos Postulantes</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-credencial.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Gestión de Credenciales</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-computer.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Entrega de Equipos</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-phone.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Entrega de Teléfonos</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-licencia.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Licencias Medicas</span>
            </button>
            <button type="button" class="s-inicio__acceso">
              <img
                class="s-inicio__ilus"
                src="assets/home/img-redirect-licenciaactiva.png"
                alt=""
              />
              <span class="s-inicio__accesoLabel">Licencias medicas Activas</span>
            </button>
          </nav>

          <div class="s-inicio__contenido">
            <div class="s-inicio__columna">
              <section
                class="s-inicio__carrusel"
                aria-roledescription="carrusel"
                aria-label="Anuncios destacados"
              >
                <div class="s-inicio__viewport">
                  <div class="s-inicio__pista">
                    <div class="s-inicio__lamina">
                      <img
                        src="assets/home/slider/madison-coffee.jpg"
                        alt="Madison Coffee: 20% de descuento de lunes a domingo en toda la carta (excepto promociones y café en grano). San Pío X 2449, a pasos de Edificio Inelcom."
                      />
                    </div>
                    <div class="s-inicio__lamina">
                      <img
                        src="assets/home/slider/metlife-reembolso.jpg"
                        alt="MetLife: reembolso de gastos médicos. Revisa el manual paso a paso aquí."
                      />
                    </div>
                    <div class="s-inicio__lamina">
                      <img
                        src="assets/home/slider/buen-trato.jpg"
                        alt="Inelcom Chile: ¿Qué es Buen Trato? No subimos el tono, nada sexual: miradas, comentarios, gestos, ni pelambres, ni burlas, ni ofensas. Ni siquiera en broma. Conoce las herramientas para tu equipo de trabajo."
                      />
                    </div>
                    <div class="s-inicio__lamina">
                      <img
                        src="assets/home/slider/seguro-complementario.jpg"
                        alt="Nuevo Seguro Complementario MetLife. Formulario: actualiza tus cargas antes del 31 de mayo."
                      />
                    </div>
                  </div>
                  <button
                    type="button"
                    class="s-inicio__nav s-inicio__nav--prev"
                    aria-label="Anuncio anterior"
                  >
                    ‹
                  </button>
                  <button
                    type="button"
                    class="s-inicio__nav s-inicio__nav--next"
                    aria-label="Anuncio siguiente"
                  >
                    ›
                  </button>
                </div>
                <div class="s-inicio__puntos"></div>
              </section>

              <div class="s-inicio__tarjetas">
                <section
                  class="c-card s-inicio__card--cumple"
                  aria-labelledby="birthdays-heading"
                >
                  <h2 class="c-card__title s-inicio__titulo" id="birthdays-heading">
                    <img class="c-icon" src="assets/home/ic-cake.svg" alt="" />
                    Cumpleaños Hoy
                  </h2>
                  <ul
                    class="s-inicio__lista"
                    data-birthdays-today
                    aria-labelledby="birthdays-heading"
                    aria-live="polite"
                  ></ul>

                  <hr class="c-divider" />

                  <h2 class="c-card__title s-inicio__titulo" id="team-birthdays-heading">
                    <img class="c-icon" src="assets/home/ic-celebration.svg" alt="" />
                    Cumpleaños de mi equipo
                  </h2>
                  <ul
                    class="s-inicio__lista"
                    data-birthdays-team
                    aria-labelledby="team-birthdays-heading"
                    aria-live="polite"
                  ></ul>
                </section>

                <section
                  class="c-card s-inicio__card--festivos"
                  aria-labelledby="holidays-heading"
                >
                  <h2 class="c-card__title s-inicio__titulo" id="holidays-heading">
                    <img class="c-icon" src="assets/home/ic-calendar.svg" alt="" />
                    Próximos Festivos
                  </h2>
                  <ul class="s-inicio__lista" data-holidays-list aria-live="polite"></ul>
                </section>
              </div>

              <section
                class="c-card s-inicio__card--beneficios"
                aria-labelledby="benefits-heading"
              >
                <h2 class="c-card__title s-inicio__titulo" id="benefits-heading">
                  <img class="c-icon" src="assets/home/ic-handshake.svg" alt="" />
                  Beneficios
                </h2>
                <div class="s-inicio__rejilla">
                  <a
                    href="https://www.cajalosandes.cl/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="s-inicio__acceso"
                  >
                    <img
                      class="s-inicio__ilus s-inicio__ilus--auto"
                      src="assets/home/img-logo-cajalosandes.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel">Caja los Andes</span>
                  </a>
                  <a
                    href="https://www.scotiabankchile.cl/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="s-inicio__acceso"
                  >
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-logo-scotiabank.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel">Scotiabank</span>
                  </a>
                  <a
                    href="https://betterfly.com/es-cl/plataforma-betterfly/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="s-inicio__acceso"
                  >
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-logo-betterfly.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel">BetterFly</span>
                  </a>
                  <a
                    href="https://www.metlife.cl/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="s-inicio__acceso"
                  >
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-logo-metlife.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel">Metlife</span>
                  </a>
                  <a
                    href="https://www.mundoachs.cl/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="s-inicio__acceso"
                  >
                    <img
                      class="s-inicio__ilus s-inicio__ilus--auto"
                      src="assets/home/img-logo-achs.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel">ACHS</span>
                  </a>
                </div>
              </section>
            </div>

            <aside
              class="s-inicio__lateral"
              aria-label="Tickets, beneficios e información"
            >
              <section
                class="c-card s-inicio__card--tickets"
                aria-labelledby="tickets-heading"
              >
                <h2 class="c-card__title s-inicio__titulo" id="tickets-heading">
                  <img class="c-icon" src="assets/home/ic-help.svg" alt="" />
                  Enviar Tickets
                </h2>
                <div class="s-inicio__tickets">
                  <button type="button" class="s-inicio__ticket">
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-ticket-soporte.png"
                      alt=""
                    />
                    <span class="s-inicio__ticketLabel">Solicitar Soporte</span>
                    <img class="c-icon" src="assets/home/ic-arrow.svg" alt="" />
                  </button>
                  <button type="button" class="s-inicio__ticket">
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-ticket-desarrollo.png"
                      alt=""
                    />
                    <span class="s-inicio__ticketLabel"
                      >Solicitar Desarrollo</span
                    >
                    <img class="c-icon" src="assets/home/ic-arrow.svg" alt="" />
                  </button>
                  <button type="button" class="s-inicio__ticket">
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-ticket-rrhh.png"
                      alt=""
                    />
                    <span class="s-inicio__ticketLabel"
                      >Solicitar a Recursos Humanos</span
                    >
                    <img class="c-icon" src="assets/home/ic-arrow.svg" alt="" />
                  </button>
                  <button type="button" class="s-inicio__ticket">
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-ticket-infraestructura.png"
                      alt=""
                    />
                    <span class="s-inicio__ticketLabel"
                      >Solicitar a Infraestructura</span
                    >
                    <img class="c-icon" src="assets/home/ic-arrow.svg" alt="" />
                  </button>
                </div>
              </section>

              <button type="button" class="s-inicio__banner">
                <span class="s-inicio__bannerTexto">
                  <span class="s-inicio__bannerTitulo"
                    >Procedimientos DataCenter</span
                  >
                  <span class="s-inicio__bannerSub">Acceso SharePoint</span>
                </span>
                <img
                  class="s-inicio__bannerImagen"
                  src="assets/home/img-sharepoint.png"
                  alt=""
                />
              </button>

              <button type="button" class="s-inicio__banner">
                <span class="s-inicio__bannerTexto">
                  <span class="s-inicio__bannerTitulo"
                    >Listado de Beneficios Caja los Andes</span
                  >
                  <span class="s-inicio__bannerSub"
                    >Julio - Agosto 2026</span
                  >
                </span>
                <img
                  class="s-inicio__bannerImagen"
                  src="assets/home/img-cajalosandes-benefit.png"
                  alt=""
                />
              </button>

              <section class="c-card s-inicio__card--info" aria-labelledby="info-heading">
                <h2 class="c-card__title s-inicio__titulo" id="info-heading">
                  <img class="c-icon" src="assets/home/ic-book.svg" alt="" />
                  Información Inelcom
                </h2>
                <div class="s-inicio__rejilla">
                  <button type="button" class="s-inicio__acceso">
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-inelcom-building.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel">Quienes Somos</span>
                  </button>
                  <button type="button" class="s-inicio__acceso">
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-inelcom-book.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel">Reglamento Interno</span>
                  </button>
                  <button type="button" class="s-inicio__acceso">
                    <img
                      class="s-inicio__ilus"
                      src="assets/home/img-inelcom-megaphone.png"
                      alt=""
                    />
                    <span class="s-inicio__accesoLabel"
                      >Comunicaciones Internas</span
                    >
                  </button>
                </div>
              </section>
            </aside>
          </div>
        </main>
      </div>

    </div>
  </body>
</html>
